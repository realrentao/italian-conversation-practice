<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🇮🇹意大利语实景会话</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f5f5;color:#333;display:flex;min-height:100vh}
/* ====== SIDEBAR ====== */
#sidebar{width:320px;min-width:320px;background:#1a1a2e;color:#fff;height:100vh;overflow-y:auto;position:sticky;top:0;display:flex;flex-direction:column}
#sidebar .header{padding:24px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
#sidebar .header h1{font-size:20px;font-weight:700;color:#fff}
#sidebar .header p{font-size:13px;color:rgba(255,255,255,.5);margin-top:2px}
#sidebar .search-wrap{padding:12px 16px}
#sidebar .search-wrap input{width:100%;padding:8px 12px;border:1px solid rgba(255,255,255,.1);border-radius:8px;font-size:13px;background:rgba(255,255,255,.06);color:#fff;outline:none}
#sidebar .search-wrap input::placeholder{color:rgba(255,255,255,.3)}
#tocContainer{flex:1;overflow-y:auto;padding-bottom:60px}
.chapter-title{padding:14px 20px;font-size:15px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center;color:rgba(255,255,255,.85);transition:.2s;border-bottom:1px solid rgba(255,255,255,.05)}
.chapter-title:hover{color:#fff;background:rgba(255,255,255,.04)}
.chapter-title .arrow{font-size:10px;transition:.2s}
.chapter-title.collapsed .arrow{transform:rotate(-90deg)}
.chapter-title .sub{font-size:11px;opacity:.55;font-weight:400}
.unit-list{overflow:hidden;transition:max-height .3s;max-height:2000px;background:rgba(255,255,255,.03)}
.unit-list.collapsed{max-height:0}
.unit-item{padding:10px 20px 10px 32px;cursor:pointer;font-size:14px;line-height:1.5;border-bottom:1px solid rgba(255,255,255,.04);color:rgba(255,255,255,.7);transition:.15s}
.unit-item:hover{color:#fff;background:rgba(255,255,255,.06)}
.unit-item.active{color:#fff;background:rgba(255,255,255,.1);border-left:3px solid #00e5ff}
.unit-item .unit-num{font-size:12px;opacity:.6;display:block}
/* ====== MAIN ====== */
#main{flex:1;min-width:0;padding:40px;max-width:1000px;margin:0 auto}
.welcome{padding:60px 0;text-align:center;color:#999}
.welcome h2{font-size:28px;color:#333;margin-bottom:12px}
.welcome p{font-size:15px;line-height:1.8}
.unit-content{display:none;animation:fadeIn .3s}
.unit-content.active{display:block}
/* Unit header */
.unit-header{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;padding:28px 32px;border-radius:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px}
.unit-header .label{font-size:13px;text-transform:uppercase;letter-spacing:1px;opacity:.7;margin-bottom:6px}
.unit-header h2{font-size:24px;font-weight:700;margin-bottom:4px}
.unit-header .sub{font-size:15px;opacity:.7}
.speed-bar{display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.1);padding:6px 10px;border-radius:10px}
.speed-bar .slabel{font-size:12px;opacity:.7;margin-right:4px}
.speed-btn{padding:5px 12px;border:none;border-radius:7px;font-size:12px;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;transition:.15s;font-family:inherit}
.speed-btn.active{background:#00e5ff;color:#1a1a2e;font-weight:700}
.section-title{font-size:18px;font-weight:700;margin:30px 0 14px;padding-bottom:8px;border-bottom:2px solid #e0e0e0;display:flex;align-items:baseline;gap:8px}
.section-title .it{font-weight:400;font-size:14px;color:#888}
/* Luogo */
.luogo-box{background:#fff;border-radius:14px;padding:20px 24px;box-shadow:0 1px 4px rgba(0,0,0,.06);line-height:1.8}
.luogo-box .lg-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.luogo-box .lg-row:last-child{margin-bottom:0}
.luogo-box .lg-key{flex:0 0 auto;font-weight:700;color:#1a1a2e}
.luogo-box .lg-val{flex:1;color:#2b2b3c}
.luogo-box .lg-zh{color:#8a8f98;font-size:.92em;font-weight:400}
/* Vocab */
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.vocab-item{display:flex;align-items:center;padding:10px 14px;background:#fff;border-radius:8px;cursor:pointer;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.vocab-item:hover{box-shadow:0 2px 8px rgba(0,0,0,.1);transform:translateY(-1px)}
.vocab-item .play-icon{font-size:11px;margin-right:10px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#e8e8e8;transition:.15s;flex-shrink:0}
.vocab-item .play-icon.playing{background:#00e5ff;color:#fff}
.vocab-item.playing{box-shadow:0 0 0 2px #00e5ff,0 2px 10px rgba(0,0,0,.12);background:#e8fbff}
.vocab-item .it{font-weight:600;color:#333;font-size:18px}
.vocab-item .zh{color:#888;font-size:16.8px;margin-left:auto;padding-left:10px}
/* Sentences */
.sent-grid{display:grid;gap:8px}
.sentence-item{display:flex;align-items:center;padding:12px 14px;background:#fff;border-radius:8px;cursor:pointer;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sentence-item:hover{box-shadow:0 2px 8px rgba(0,0,0,.1)}
.sentence-item .s-play{font-size:11px;width:30px;height:30px;border:none;border-radius:50%;background:#e8e8e8;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;margin-right:12px}
.sentence-item .s-play.playing{background:#00e5ff;color:#fff}
.sentence-item.playing{box-shadow:0 0 0 2px #00e5ff,0 2px 10px rgba(0,0,0,.12);background:#e8fbff}
.sentence-item .s-text{flex:1;min-width:0}
.sentence-item .it{font-weight:600;color:#333;font-size:18px;line-height:1.6}
.sentence-item .zh{font-size:15.6px;color:#888;margin-top:2px;line-height:1.6}
/* Dialogue */
.dialogue-seg{background:#fff;border-radius:14px;padding:18px 22px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:14px}
.dialogue-seg .d-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dialogue-seg .d-play{font-size:12px;width:32px;height:32px;border:none;border-radius:50%;background:#1a1a2e;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.dialogue-seg .d-play.playing{background:#00e5ff;color:#1a1a2e}
.dialogue-seg .d-tag{font-size:13px;font-weight:500;color:#666}
.dialogue-seg .d-it{font-size:15px;font-weight:500;color:#222;line-height:1.7;white-space:pre-wrap;background:#f8f9ff;padding:12px 14px;border-radius:8px;border-left:3px solid #00e5ff;margin-bottom:8px}
.dialogue-seg .d-zh{font-size:14px;color:#555;line-height:1.8;white-space:pre-wrap}
.pair-line{position:relative;padding:9px 10px;border-bottom:1px dashed #e6e8f0;cursor:pointer;transition:.15s;border-radius:8px;margin:0 -10px}
.pair-line:hover{background:#f0faff}
.pair-line.playing{background:#e8fbff;box-shadow:0 0 0 2px #00e5ff}
.pair-line:last-child{border-bottom:none}
.pair-line .d-it{border-left:none;background:transparent;padding:0;margin-bottom:3px;font-size:19.2px;line-height:1.6}
.pair-line .d-zh{padding:0;font-size:19.2px;line-height:1.8;color:#555}
.conv{display:flex;flex-direction:column;gap:14px;margin-top:4px}
.conv-row{display:flex;flex-direction:column;max-width:90%}
.conv-row.aldo{align-self:flex-start;align-items:flex-start}
.conv-row.signora{align-self:flex-end;align-items:flex-end}
.conv-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.conv-row.signora .conv-head{flex-direction:row-reverse}
.conv-who{font-size:12px;font-weight:600}
.conv-row.aldo .conv-who{color:#0a7ea4}
.conv-row.signora .conv-who{color:#d14b8a}
.conv-bubble{border-radius:16px;padding:10px 14px;box-shadow:0 1px 3px rgba(0,0,0,.05);cursor:pointer;transition:.15s}
.conv-bubble:hover{filter:brightness(.985)}
.conv-bubble.playing{box-shadow:0 0 0 2px #00e5ff}
.conv-ctl{margin-bottom:10px}
.conv-card{background:#fff;border-radius:14px;padding:18px 22px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.conv-row.aldo .conv-bubble{background:#eef7fb;border:1px solid #d3ebf5;border-bottom-left-radius:4px}
.conv-row.signora .conv-bubble{background:#fdeef5;border:1px solid #f6d6e6;border-bottom-right-radius:4px}
.conv-bubble .d-it{font-size:18px;font-weight:500;color:#222;line-height:1.6;white-space:pre-wrap;background:transparent;padding:0;margin:0;border:0}
.conv-bubble .d-zh{font-size:15.6px;color:#667;line-height:1.7;margin-top:3px;white-space:pre-wrap;padding:0}
/* Notes */
.note-grid{display:grid;gap:12px}
.note-item{padding:16px;background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:3px solid #1a1a2e}
.note-item .term{font-weight:700;color:#1a1a2e;margin-bottom:4px;font-size:18px;line-height:1.5}
.note-item .explain{font-size:14px;color:#555;line-height:1.6}
.note-item .examples{margin-top:8px}
.note-item .note-ex{font-size:15.6px;color:#000;line-height:1.8;padding:6px 0 6px 16px;position:relative;white-space:pre-line;cursor:pointer;transition:.15s;border-radius:8px}
.note-item .note-ex:before{content:"•";position:absolute;left:2px;color:#00e5ff;font-size:15px}
.note-item .note-ex:hover{background:#f0faff}
.note-item .note-ex.playing{background:#e8fbff;box-shadow:0 0 0 2px #00e5ff}
.note-item .term-word{color:#0a6ebd;cursor:pointer;transition:.15s}
.note-item .term-word:hover{text-decoration:underline}
.note-item .term-word.playing{color:#00e5ff}
.note-item .term-slash{color:#999;font-weight:400}
.note-item .term-zh{color:#1a1a2e;font-weight:700}
.note-item .ex-it{font-weight:600}
.note-item .ex-zh{display:block;font-size:12px;color:#333;margin-top:2px}
/* Informazioni utili 实用信息 */
.info-card{background:#fff;border:1px solid #e6e8f0;border-radius:14px;padding:20px 24px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.info-block{margin-bottom:20px}
.info-block:last-child{margin-bottom:0}
.info-block .info-sub{font-weight:700;color:#1a1a2e;font-size:17px;line-height:1.5;margin-bottom:8px;padding-left:12px;position:relative}
.info-block .info-sub:before{content:"";position:absolute;left:0;top:7px;width:4px;height:15px;border-radius:2px;background:#1a1a2e}
.info-block .info-intro{font-size:15px;color:#444;line-height:1.9;margin-bottom:12px}
.info-block .info-item{padding-left:16px;position:relative;margin-bottom:11px;line-height:1.85}
.info-block .info-item:before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:#00a0c0}
.info-block .info-term{font-weight:700;color:#1a1a2e;font-size:15px}
.info-block .info-text{color:#444;font-size:15px}
/* Mobile */
#sidebarToggle{display:none;position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:#1a1a2e;color:#fff;border:none;font-size:24px;cursor:pointer;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#sidebarOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50}
@media(max-width:768px){#sidebar{position:fixed;left:-320px;z-index:99;transition:left .3s}#sidebar.open{left:0}#sidebarToggle{display:flex;align-items:center;justify-content:center}#sidebarOverlay.show{display:block}#main{padding:20px;width:100%}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div id="sidebar">
  <div class="header">
    <h1>🇮🇹意大利语实景会话</h1>
  </div>
  <div class="search-wrap"><input type="text" id="searchInput" placeholder="搜索单元 / 关键词…" oninput="filterTOC(this.value)"></div>
  <div id="tocContainer"></div>
</div>

<div id="main">
  <div class="welcome" id="welcomePanel">
    <h2>Benvenuti! 🇮🇹</h2>
    <p>点击左侧目录选择课程<br>每单元包含：场景人物 · 关键词 · 常用句 · 课文 · 词法解析</p>
  </div>
  <div id="unitContentContainer"></div>
</div>

<button id="sidebarToggle" onclick="toggleSidebar()">&#9776;</button>
<div id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- 数据分层：首屏只加载极小的目录索引；点开单元才按需加载对应 data/<id>.js -->
<script defer src="data/index.js"></script>
<script defer src="app.js"></script>
</body>
</html>
